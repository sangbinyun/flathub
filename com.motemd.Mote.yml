# Flatpak manifest for Flathub (flathub/flathub). Generated by tools/release/publish.sh from
# ../com.motemd.Mote.yml: the archive is the release asset, pinned by digest.
app-id: com.motemd.Mote
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: mote
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home          # a file editor: the user's documents
  - --talk-name=org.freedesktop.IBus      # Korean input through ibus on X11; Wayland text-input needs nothing
  - --talk-name=org.fcitx.Fcitx5
  - --env=GTK_PATH=/app/lib/gtk-4.0   # our floor-version ibus module first (see the archive); the runtime's newer one breaks on older daemons
modules:
  - name: mote
    buildsystem: simple
    build-commands:
      - cp -r usr/. /app/
    sources:
      - type: archive
        url: https://github.com/motemd/mote/releases/download/v0.9.0-beta.3/mote-0.9.0-beta.3-linux-x86_64-bin.tar.xz
        sha256: "e7b680c56c18b608b05c72257c1ab1d53ce1b2e7f9fa993e7d1b7d23d97e1c1a"
